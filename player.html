<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Player — GK Buzzer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<style>
:root{--bg:#080810;--surface:#12121e;--surface2:#1a1a2a;--accent:#f5c842;--green:#3ecf72;--red:#e8503a;--text:#eeeef0;--muted:#666;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:1.5rem;overflow:hidden;}
.screen{display:none;flex-direction:column;align-items:center;justify-content:center;width:100%;max-width:420px;text-align:center;}
.screen.active{display:flex;}

.logo{font-family:'Bebas Neue',sans-serif;font-size:44px;letter-spacing:3px;line-height:1.1;}
.logo span{color:var(--accent);}
.sub{font-size:12px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:6px;margin-bottom:2rem;}
.jcard{background:var(--surface);border:0.5px solid var(--border2);border-radius:20px;padding:1.75rem;width:100%;}
.lbl{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block;text-align:left;}
.inp{width:100%;background:var(--surface2);border:0.5px solid var(--border2);border-radius:10px;color:var(--text);font-family:'Sora',sans-serif;font-size:16px;padding:13px 16px;outline:none;transition:border-color 0.15s;margin-bottom:1rem;}
.inp:focus{border-color:var(--accent);}
.sdisp{background:var(--surface2);border-radius:10px;padding:10px 14px;font-size:13px;color:var(--muted);text-align:left;margin-bottom:1.25rem;}
.sdisp strong{color:var(--accent);}
.bjoin{width:100%;background:var(--accent);color:#111;border:none;border-radius:12px;padding:15px;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;cursor:pointer;}
.bjoin:disabled{opacity:0.4;cursor:not-allowed;}

.wait-icon{font-size:56px;margin-bottom:1rem;animation:bob 2s ease-in-out infinite;}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
.wt{font-family:'Bebas Neue',sans-serif;font-size:34px;letter-spacing:2px;margin-bottom:8px;}
.ws{font-size:14px;color:var(--muted);line-height:1.6;}
.pbadge{display:inline-flex;align-items:center;gap:10px;background:var(--surface);border:0.5px solid var(--border2);border-radius:99px;padding:8px 18px 8px 8px;margin-top:1.5rem;}
.pav{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;}

#sbuzz{background:radial-gradient(ellipse at 50% 40%,#1a1530 0%,#080810 65%);min-height:100vh;position:fixed;top:0;left:0;right:0;bottom:0;}
.bqn{font-size:11px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:2rem;}
.bbtn{width:200px;height:200px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe066,#f5c842 50%,#c99a1a);border:none;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;box-shadow:0 8px 32px rgba(0,0,0,0.5);transition:transform 0.1s,opacity 0.2s;animation:glow 2.5s ease-in-out infinite;user-select:none;margin-bottom:1.5rem;}
@keyframes glow{0%,100%{box-shadow:0 0 0 0 rgba(245,200,66,0.3),0 8px 32px rgba(0,0,0,0.5)}50%{box-shadow:0 0 0 24px rgba(245,200,66,0.08),0 8px 40px rgba(245,200,66,0.25)}}
.bbtn:active{transform:scale(0.91);}
.bbtn:disabled{filter:grayscale(0.7);opacity:0.45;animation:none;cursor:not-allowed;}
.bell{font-size:56px;line-height:1;}
.blbl{font-family:'Bebas Neue',sans-serif;font-size:26px;letter-spacing:3px;color:#111;}
.bres{font-size:14px;color:var(--muted);line-height:1.7;max-width:280px;}

/* Result states shown on player */
.res-correct{background:rgba(62,207,114,0.12);border:1.5px solid var(--green);border-radius:12px;padding:16px 20px;color:var(--green);font-weight:600;font-size:16px;animation:popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);}
.res-wrong{background:rgba(232,80,58,0.12);border:1.5px solid var(--red);border-radius:12px;padding:16px 20px;color:var(--red);font-weight:600;font-size:16px;animation:popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);}
.res-reveal{background:var(--surface);border:1.5px solid var(--accent);border-radius:12px;padding:16px 20px;color:var(--accent);font-weight:600;font-size:15px;animation:popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275);}
@keyframes popIn{from{transform:scale(0.7);opacity:0}to{transform:scale(1);opacity:1}}

#sdone{min-height:100vh;}
.dicon{font-size:72px;margin-bottom:1rem;}
.dtitle{font-family:'Bebas Neue',sans-serif;font-size:48px;letter-spacing:2px;margin-bottom:8px;}
.dsub{font-size:14px;color:var(--muted);}
</style>
</head>
<body>

<div class="screen active" id="sjoin">
  <div class="logo">GENERAL<br><span>KNOWLEDGE</span><br>BUZZER</div>
  <p class="sub">Sprint Retro Icebreaker</p>
  <div class="jcard">
    <label class="lbl">Your name</label>
    <input class="inp" id="ninp" placeholder="Enter your name..." maxlength="20" onkeydown="if(event.key==='Enter')joinSession()">
    <div class="sdisp">Session: <strong id="sdname">loading...</strong></div>
    <button class="bjoin" id="bjoin" onclick="joinSession()">JOIN GAME</button>
  </div>
</div>

<div class="screen" id="swait">
  <div class="wait-icon">⏳</div>
  <div class="wt">You're in!</div>
  <p class="ws">Waiting for the host<br>to start the game...</p>
  <div class="pbadge">
    <div class="pav" id="wav"></div>
    <span id="wnm"></span>
  </div>
</div>

<div class="screen" id="sbuzz">
  <div class="bqn" id="bqn">Question 1 of 15</div>
  <button class="bbtn" id="bbtn" onclick="doBuzz()">
    <span class="bell">🔔</span>
    <span class="blbl">BUZZ!</span>
  </button>
  <div class="bres" id="bres">Know the answer? Buzz in! 🎯</div>
</div>

<div class="screen" id="sdone">
  <div class="dicon">🎉</div>
  <div class="dtitle">GAME OVER!</div>
  <p class="dsub">Salamat sa paglalaro!<br>Check the host screen 🏆</p>
</div>

<script>
const ABLY_KEY='MMHXMA.LyX_CA:vmk1bi-kBXtY7hQb_JIsflNO5dIdf_lutEhLBaO6C0g';
const AC=[{bg:'#1e1535',color:'#a78bfa'},{bg:'#0f2318',color:'#4ade80'},{bg:'#2a1010',color:'#f87171'},{bg:'#0e1d2e',color:'#60a5fa'},{bg:'#2a2208',color:'#fbbf24'},{bg:'#2a0e20',color:'#f472b6'},{bg:'#082a25',color:'#34d399'},{bg:'#1e2a08',color:'#a3e635'}];


// ===== PLAYER SOUNDS =====
const PACtx = window.AudioContext || window.webkitAudioContext;
let pactx = null;
function getPACtx(){ if(!pactx) pactx = new PACtx(); if(pactx.state==='suspended') pactx.resume(); return pactx; }
function pTone(f,t,dur,vol,delay){
  var ctx=getPACtx(); var o=ctx.createOscillator(); var g=ctx.createGain();
  o.connect(g); g.connect(ctx.destination);
  o.type=t||'sine'; o.frequency.value=f;
  g.gain.setValueAtTime(vol||0.3,ctx.currentTime+(delay||0));
  g.gain.exponentialRampToValueAtTime(0.001,ctx.currentTime+(delay||0)+dur);
  o.start(ctx.currentTime+(delay||0)); o.stop(ctx.currentTime+(delay||0)+dur+0.05);
}
function pBuzzSound(){
  pTone(300,'sawtooth',0.06,0.5,0);
  pTone(200,'square',0.1,0.6,0.05);
  pTone(800,'sine',0.15,0.4,0);
  pTone(1000,'sine',0.1,0.3,0.08);
}
function pCorrectSound(){
  pTone(523,'sine',0.15,0.4,0);
  pTone(659,'sine',0.15,0.4,0.1);
  pTone(784,'sine',0.15,0.4,0.2);
  pTone(1047,'sine',0.4,0.5,0.35);
}
function pWrongSound(){
  pTone(250,'sawtooth',0.12,0.4,0);
  pTone(180,'sawtooth',0.15,0.4,0.12);
  pTone(120,'sawtooth',0.2,0.5,0.25);
}
// ===== END PLAYER SOUNDS =====

const params=new URLSearchParams(location.search);
const sessionId=params.get('session')||'sprint86';
document.getElementById('sdname').textContent=sessionId;

let ably,channel;
let myId='p_'+Math.random().toString(36).slice(2,9);
let myName='',myCI=Math.floor(Math.random()*8);
let buzzed=false,curQ=0,lastPhase='',lastQ=-1;

const ini=function(n){return n.split(' ').map(function(w){return w[0];}).join('').toUpperCase().slice(0,2);};
const showScreen=function(id){document.querySelectorAll('.screen').forEach(function(s){s.classList.remove('active');});document.getElementById(id).classList.add('active');};

async function joinSession(){
  const name=document.getElementById('ninp').value.trim();
  if(!name)return;
  myName=name;
  const btn=document.getElementById('bjoin');
  btn.disabled=true;btn.textContent='CONNECTING...';

  ably=new Ably.Realtime(ABLY_KEY);
  await new Promise(function(r){ably.connection.once('connected',r);});
  channel=ably.channels.get('buzzer-'+sessionId);

  await channel.subscribe('state',function(msg){
    const data=msg.data;
    if(!data||!data.gameStarted)return;
    if(data.phase==='done'){showScreen('sdone');return;}

    if(data.phase==='correct'){
      pCorrectSound();
      document.getElementById('bres').innerHTML='<div class="res-correct">✅ CORRECT!</div>';
      document.getElementById('bbtn').disabled=true;
      return;
    }
    if(data.phase==='wrong'){
      pWrongSound();
      document.getElementById('bres').innerHTML='<div class="res-wrong">❌ WRONG! Next buzz?</div>';
      document.getElementById('bbtn').disabled=false;
      buzzed=false;
      return;
    }
    if(data.phase==='reveal'){
      document.getElementById('bres').innerHTML='<div class="res-reveal">🔎 Answer revealed by host!</div>';
      document.getElementById('bbtn').disabled=true;
      return;
    }
    if(data.phase==='question'){
      if(lastQ!==data.q||lastPhase!=='question'){
        lastPhase='question';lastQ=data.q;curQ=data.q;
        loadBuzzScreen();
      }
    }
  });

  const c=AC[myCI];
  const av=document.getElementById('wav');
  av.style.background=c.bg;av.style.color=c.color;av.textContent=ini(name);
  document.getElementById('wnm').textContent=name;
  showScreen('swait');

  setTimeout(function(){
    channel.publish('player-join',{id:myId,name:myName});
  },800);
}

function loadBuzzScreen(){
  buzzed=false;
  document.getElementById('bqn').textContent='Question '+(curQ+1)+' of 15';
  document.getElementById('bres').textContent='Know the answer? Buzz in! 🎯';
  document.getElementById('bbtn').disabled=false;
  showScreen('sbuzz');
}

function doBuzz(){
  if(buzzed)return;
  buzzed=true;
  pBuzzSound();
  channel.publish('buzz',{id:myId,name:myName});
  document.getElementById('bbtn').disabled=true;
  document.getElementById('bres').innerHTML='<div style="animation:popIn 0.4s cubic-bezier(0.175,0.885,0.32,1.275)"><div style="font-size:36px">🔔</div><div style="font-family:\'Bebas Neue\',sans-serif;font-size:26px;color:var(--accent);letter-spacing:2px;margin-top:8px;">BUZZED!</div><div style="font-size:13px;color:var(--muted);margin-top:6px;">Wait for the host to call you! 🎤</div></div>';
}
</script>
</body>
</html>

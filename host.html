<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Host — Sprint Retro Buzzer</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Sora:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://cdn.ably.com/lib/ably.min-2.js"></script>
<style>
:root{--bg:#080810;--surface:#12121e;--surface2:#1a1a2a;--surface3:#222234;--accent:#f5c842;--green:#3ecf72;--red:#e8503a;--text:#eeeef0;--muted:#666;--muted2:#444;--border:rgba(255,255,255,0.06);--border2:rgba(255,255,255,0.11);}
*{box-sizing:border-box;margin:0;padding:0;}
body{background:var(--bg);color:var(--text);font-family:'Sora',sans-serif;min-height:100vh;}
.screen{display:none;}.screen.active{display:flex;}

#setup{flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:radial-gradient(ellipse at 50% 20%,#1c1830 0%,#080810 60%);}
.logo{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,9vw,96px);letter-spacing:4px;line-height:1;text-align:center;}
.logo span{color:var(--accent);}
.sub{font-size:13px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-top:8px;margin-bottom:3rem;text-align:center;}
.card{background:var(--surface);border:0.5px solid var(--border2);border-radius:20px;padding:2rem;width:100%;max-width:480px;}
.lbl{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:8px;display:block;}
.inp{width:100%;background:var(--surface2);border:0.5px solid var(--border2);border-radius:10px;color:var(--text);font-family:'Sora',sans-serif;font-size:15px;padding:11px 14px;outline:none;transition:border-color 0.15s;margin-bottom:1.25rem;}
.inp:focus{border-color:var(--accent);}
.btn{width:100%;background:var(--accent);color:#111;border:none;border-radius:12px;padding:14px;font-family:'Bebas Neue',sans-serif;font-size:22px;letter-spacing:3px;cursor:pointer;transition:opacity 0.15s;}
.btn:hover:not(:disabled){opacity:0.9;}
.btn:disabled{opacity:0.3;cursor:not-allowed;}
.share-box{background:var(--surface2);border:0.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:1rem;display:none;}
.share-box b{font-size:10px;color:var(--accent);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:6px;}
.surl{color:var(--text);font-size:12px;word-break:break-all;cursor:pointer;}
.surl:hover{color:var(--accent);}
.copy-hint{font-size:11px;color:var(--muted);margin-top:3px;}
.wbox{background:var(--surface2);border:0.5px solid var(--border);border-radius:10px;padding:12px 14px;margin-top:10px;display:none;}
.wbox b{font-size:10px;color:var(--green);letter-spacing:1.5px;text-transform:uppercase;display:block;margin-bottom:8px;}
.chips{display:flex;flex-wrap:wrap;gap:6px;min-height:24px;}
.chip{background:var(--surface3);border-radius:99px;padding:4px 12px;font-size:13px;animation:pop 0.3s ease;}
@keyframes pop{from{opacity:0;transform:scale(0.8)}to{opacity:1;transform:scale(1)}}

#game{flex-direction:column;min-height:100vh;padding:1.5rem 2rem;}
.gh{display:flex;align-items:center;gap:16px;margin-bottom:1.25rem;max-width:1200px;margin-left:auto;margin-right:auto;width:100%;}
.ql{font-size:13px;color:var(--muted);white-space:nowrap;}
.prog{flex:1;height:3px;background:var(--surface2);border-radius:99px;overflow:hidden;}
.prog-f{height:100%;background:var(--accent);border-radius:99px;transition:width 0.4s;}

.gg{display:grid;grid-template-columns:1fr 360px;gap:16px;max-width:1200px;margin:0 auto;width:100%;}
.qcard{background:var(--surface);border:0.5px solid var(--border2);border-radius:16px;padding:2rem 2.5rem;margin-bottom:12px;}
.qnum{font-size:11px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--accent);margin-bottom:12px;}
.qtxt{font-size:clamp(22px,3vw,32px);font-weight:500;line-height:1.45;}
.hint-tag{display:inline-block;margin-top:12px;background:var(--surface2);border-radius:99px;padding:4px 14px;font-size:12px;color:var(--muted);}

.ar{display:flex;gap:10px;margin-top:4px;}
.bn{background:var(--accent);color:#111;border:none;border-radius:10px;padding:12px 28px;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;cursor:pointer;transition:opacity 0.15s;}
.bn:hover{opacity:0.88;}
.bn.outline{background:transparent;color:var(--text);border:0.5px solid var(--border2);}
.bn.outline:hover{border-color:var(--accent);}

.rc{display:flex;flex-direction:column;gap:12px;}
.panel{background:var(--surface);border:0.5px solid var(--border2);border-radius:16px;padding:1.25rem;}
.pt{font-size:10px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--muted);margin-bottom:12px;}
.bzlist{display:flex;flex-direction:column;gap:8px;min-height:80px;}
.bzi{display:flex;align-items:center;gap:10px;background:var(--surface2);border:0.5px solid var(--border);border-radius:10px;padding:10px 12px;animation:pop 0.4s cubic-bezier(0.175,0.885,0.32,1.275);}
.bzr{font-family:'Bebas Neue',sans-serif;font-size:22px;min-width:38px;}
.bzr.r1{color:#f5c842;}.bzr.r2{color:#b0b0b0;}.bzr.r3{color:#cd7f32;}
.bze{font-size:13px;color:var(--muted2);font-style:italic;text-align:center;padding:1rem 0;}
.pr{display:flex;align-items:center;gap:8px;padding:7px 0;border-bottom:0.5px solid var(--border);}
.pr:last-child{border-bottom:none;}
.od{width:7px;height:7px;border-radius:50%;background:var(--green);flex-shrink:0;}

#results{flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:2rem;background:radial-gradient(ellipse at 50% 30%,#101e18 0%,#080810 65%);}
.rt{font-family:'Bebas Neue',sans-serif;font-size:clamp(52px,9vw,96px);text-align:center;line-height:1;margin-bottom:6px;}
.rs{font-size:13px;color:var(--muted);letter-spacing:2px;text-transform:uppercase;margin-bottom:2.5rem;}
.final-wrap{width:100%;max-width:500px;display:flex;flex-direction:column;gap:10px;margin-bottom:2rem;}
.final-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:0.5px solid var(--border);border-radius:12px;padding:14px 18px;}
.fr-rank{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--muted);min-width:32px;}
.fr-av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:600;flex-shrink:0;}
.fr-name{flex:1;font-size:15px;font-weight:500;}
.fr-pts{font-family:'Bebas Neue',sans-serif;font-size:28px;color:var(--accent);}
.fr-label{font-size:11px;color:var(--muted);margin-left:2px;}
.bo{background:transparent;color:var(--text);border:1.5px solid var(--border2);border-radius:10px;padding:12px 28px;font-family:'Bebas Neue',sans-serif;font-size:18px;letter-spacing:2px;cursor:pointer;}
.bo:hover{border-color:var(--accent);}

.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%) translateY(-80px);background:var(--accent);color:#111;font-family:'Bebas Neue',sans-serif;font-size:20px;letter-spacing:2px;padding:10px 28px;border-radius:12px;transition:transform 0.35s cubic-bezier(0.175,0.885,0.32,1.275);z-index:9999;pointer-events:none;white-space:nowrap;}
.toast.show{transform:translateX(-50%) translateY(0);}
</style>
</head>
<body>
<div class="toast" id="toast"></div>

<div id="setup" class="screen active">
  <div class="logo">SPRINT RETRO<br><span>BUZZER</span></div>
  <p class="sub">Icebreaker Game · Host View</p>
  <div class="card">
    <label class="lbl">Session Code</label>
    <input class="inp" id="sinp" placeholder="e.g. sprint86" value="sprint86" maxlength="20">
    <button class="btn" id="bcreate" onclick="createSession()">CREATE SESSION</button>
    <div class="share-box" id="sbox">
      <b>Share this link with players 👇</b>
      <div class="surl" id="surl" onclick="copyUrl()"></div>
      <div class="copy-hint">Click to copy 📋</div>
    </div>
    <div class="wbox" id="wbox">
      <b id="wcnt">0 players online</b>
      <div class="chips" id="chips"></div>
    </div>
    <button class="btn" id="blaunch" style="display:none;margin-top:1rem;" onclick="launchGame()">START GAME →</button>
  </div>
</div>

<div id="game" class="screen">
  <div class="gh">
    <span class="ql" id="qlbl">Q 1 / 15</span>
    <div class="prog"><div class="prog-f" id="pgf"></div></div>
    <span style="font-size:13px;color:var(--muted);" id="qcount">1/15</span>
  </div>
  <div class="gg">
    <div>
      <div class="qcard">
        <div class="qnum" id="qnum">QUESTION 1</div>
        <div class="qtxt" id="qtxt"></div>
        <div class="hint-tag" id="qhint" style="display:none;"></div>
      </div>
      <div class="ar">
        <button class="bn outline" onclick="prevQ()" id="bprev" style="display:none;">← PREV</button>
        <button class="bn" id="bnxt" onclick="nextQuestion()">NEXT QUESTION →</button>
      </div>
    </div>
    <div class="rc">
      <div class="panel">
        <div class="pt">Buzz Order 🔔</div>
        <div class="bzlist" id="bzlist"><div class="bze">Waiting for buzzes...</div></div>
        <button onclick="clearBuzz()" style="margin-top:10px;background:none;border:0.5px solid var(--border2);color:var(--muted);border-radius:8px;padding:6px 14px;font-size:12px;cursor:pointer;width:100%;">Clear Buzzes</button>
      </div>
      <div class="panel">
        <div class="pt">Players Online</div>
        <div id="ppanel"><p style="font-size:13px;color:var(--muted2);font-style:italic;">No players yet...</p></div>
      </div>
    </div>
  </div>
</div>

<div id="results" class="screen">
  <div class="rt">THAT'S A WRAP!</div>
  <p class="rs">Thanks for playing, mga lodi! 🎉</p>
  <div class="final-wrap" id="final-wrap"></div>
  <button class="bo" onclick="location.reload()">PLAY AGAIN</button>
</div>

<script>
const ABLY_KEY='MMHXMA.LyX_CA:vmk1bi-kBXtY7hQb_JIsflNO5dIdf_lutEhLBaO6C0g';
const AC=[{bg:'#1e1535',color:'#a78bfa'},{bg:'#0f2318',color:'#4ade80'},{bg:'#2a1010',color:'#f87171'},{bg:'#0e1d2e',color:'#60a5fa'},{bg:'#2a2208',color:'#fbbf24'},{bg:'#2a0e20',color:'#f472b6'},{bg:'#082a25',color:'#34d399'},{bg:'#1e2a08',color:'#a3e635'}];

const Q=[
  {q:'Anong ulam ang madalas i-partner sa sinigang?',hint:''},
  {q:'Kumpletuhin: "Bahala na si ______."',hint:'Fill in the blank!'},
  {q:'Ano ang pinaka-common na laman ng baon sa office kapag petsa de peligro?',hint:''},
  {q:'Anong tawag sa maliit na tindahan sa kanto?',hint:''},
  {q:'Sino ang kilalang "Pambansang Kamao" ng Pilipinas?',hint:'Bonus kung alam full name 😄'},
  {q:'"____ seconds rule!" — anong number?',hint:'Kapag nahulog ang pagkain 😂'},
  {q:'Anong softdrink ang madalas i-partner sa fast food dito sa PH?',hint:''},
  {q:'Kumpletuhin: "Pag may tiyaga, may ______."',hint:'Fill in the blank!'},
  {q:'Ano ang tawag sa traffic na halos di na gumagalaw?',hint:'Pinoy term 😅'},
  {q:'Anong app ang pinaka ginagamit pang chat sa Pilipinas?',hint:''},
  {q:'Ano ang tawag sa jeep na puno na pero pinipilit pa rin sumakay?',hint:'😂'},
  {q:'Anong ulam ang laging present sa handaan?',hint:'Kahit anong acceptable answer!'},
  {q:'Sino ang "Hari ng Sablay" sa mga last-minute tasks?',hint:'Self-reflect 😆'},
  {q:'Anong ginagawa mo kapag nawalan ng internet habang may meeting?',hint:''},
  {q:'Kumpletuhin: "Kape muna bago ______."',hint:'Fill in the blank!'},
];

let ably,channel,sessionId;
let players={},scores={},buzzOrder=[];
let curQ=0,gameStarted=false;

const ini=n=>n.split(' ').map(w=>w[0]).join('').toUpperCase().slice(0,2);
const gci=id=>Math.max(0,Object.keys(players).indexOf(id)%8);
const avEl=(name,id,sz=34)=>{const c=AC[gci(id)];return `<div style="width:${sz}px;height:${sz}px;border-radius:50%;background:${c.bg};color:${c.color};display:flex;align-items:center;justify-content:center;font-size:${Math.round(sz*.35)}px;font-weight:600;flex-shrink:0;">${ini(name)}</div>`;};
const toast=msg=>{const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2500);};
const showScreen=id=>{document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));document.getElementById(id).classList.add('active');};

function broadcastState(){
  channel.publish('state',{gameStarted,q:curQ,phase:'question'});
}

async function createSession(){
  sessionId=document.getElementById('sinp').value.trim().replace(/\s+/g,'-').toLowerCase()||'sprint86';
  document.getElementById('sinp').disabled=true;
  document.getElementById('bcreate').disabled=true;
  document.getElementById('bcreate').textContent='CONNECTING...';

  ably=new Ably.Realtime(ABLY_KEY);
  await new Promise(r=>ably.connection.once('connected',r));
  channel=ably.channels.get('buzzer-'+sessionId);

  channel.subscribe('player-join',function(msg){
    const data=msg.data;
    if(!data||!data.id||!data.name)return;
    if(!players[data.id]){
      players[data.id]=data.name;
      scores[data.id]=0;
      renderWaiting();
      renderPlayers();
      toast('🙋 '+data.name+' joined!');
    }
    broadcastState();
  });

  channel.subscribe('buzz',function(msg){
    const data=msg.data;
    if(!data||!data.id||!data.name)return;
    if(buzzOrder.find(function(b){return b.id===data.id;})||buzzOrder.length>=3)return;
    buzzOrder.push({id:data.id,name:data.name});
    renderBuzz();
    toast('🔔 '+['1ST','2ND','3RD'][buzzOrder.length-1]+': '+data.name+'!');
  });

  const purl=location.origin+location.pathname.replace('host.html','player.html')+'?session='+sessionId;
  document.getElementById('surl').textContent=purl;
  document.getElementById('sbox').style.display='block';
  document.getElementById('wbox').style.display='block';
  document.getElementById('blaunch').style.display='block';
  document.getElementById('bcreate').textContent='SESSION CREATED ✓';
  toast('Session created! Share the link 🎉');

  // Broadcast state every 2s for late joiners
  setInterval(function(){if(gameStarted)broadcastState();},2000);
}

function copyUrl(){navigator.clipboard.writeText(document.getElementById('surl').textContent).then(function(){toast('Link copied! 📋');});}

function renderWaiting(){
  const names=Object.values(players);
  document.getElementById('wcnt').textContent=names.length+' player'+(names.length!==1?'s':'')+' online';
  document.getElementById('chips').innerHTML=names.map(function(n){return '<div class="chip">'+n+'</div>';}).join('');
}

function renderPlayers(){
  const s=Object.entries(players).sort(function(a,b){return (scores[b[0]]||0)-(scores[a[0]]||0);});
  document.getElementById('ppanel').innerHTML=s.length
    ?s.map(function(e){const id=e[0],name=e[1];return '<div class="pr">'+avEl(name,id,28)+'<span style="flex:1;font-size:13px;font-weight:500;">'+name+'</span><div class="od"></div></div>';}).join('')
    :'<p style="font-size:13px;color:var(--muted2);font-style:italic;">No players yet...</p>';
}

function renderBuzz(){
  const rk=['1ST','2ND','3RD'],rc=['r1','r2','r3'];
  document.getElementById('bzlist').innerHTML=buzzOrder.length
    ?buzzOrder.map(function(b,i){return '<div class="bzi"><span class="bzr '+rc[i]+'">'+rk[i]+'</span>'+avEl(b.name,b.id,36)+'<div style="font-size:15px;font-weight:600;">'+b.name+'</div></div>';}).join('')
    :'<div class="bze">Waiting for buzzes...</div>';
}

function clearBuzz(){
  buzzOrder=[];
  renderBuzz();
  channel.publish('state',{gameStarted,q:curQ,phase:'question',cleared:true});
}

function launchGame(){
  gameStarted=true;
  showScreen('game');
  broadcastState();
  loadQ();
}

function loadQ(){
  const q=Q[curQ];
  document.getElementById('qlbl').textContent='Q '+(curQ+1)+' / '+Q.length;
  document.getElementById('pgf').style.width=(((curQ+1)/Q.length)*100)+'%';
  document.getElementById('qnum').textContent='QUESTION '+(curQ+1);
  document.getElementById('qtxt').textContent=q.q;
  const hint=document.getElementById('qhint');
  if(q.hint){hint.textContent=q.hint;hint.style.display='inline-block';}
  else{hint.style.display='none';}
  document.getElementById('bnxt').textContent=curQ<Q.length-1?'NEXT QUESTION →':'FINISH GAME →';
  document.getElementById('bprev').style.display=curQ>0?'inline-block':'none';
  buzzOrder=[];
  renderBuzz();
  broadcastState();
}

function nextQuestion(){
  curQ++;
  if(curQ>=Q.length)showResults();
  else loadQ();
}

function prevQ(){
  if(curQ>0){curQ--;loadQ();}
}

function showResults(){
  showScreen('results');
  channel.publish('state',{gameStarted:true,phase:'done'});
  const sorted=Object.entries(players);
  document.getElementById('final-wrap').innerHTML=sorted.length
    ?sorted.map(function(e,i){const id=e[0],name=e[1];const c=AC[gci(id)];return '<div class="final-row"><span class="fr-rank">'+(i+1)+'</span><div class="fr-av" style="background:'+c.bg+';color:'+c.color+'">'+ini(name)+'</div><span class="fr-name">'+name+'</span><span style="font-size:13px;color:var(--muted)">Thanks for playing! 🎉</span></div>';}).join('')
    :'<p style="color:var(--muted)">No players recorded.</p>';
}
</script>
</body>
</html>
